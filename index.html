<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c0f0e">
<meta name="description" content="The Unassuming Tavern: a doorway to Poly Runner, Bloodsoup Hell and Lifebrained.">
<title>the Unassuming Tavern</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="assets/floor.png" as="image">
<link rel="preload" href="assets/fonts/press-start-2p-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="scene">
  <div class="torch torch-l" data-sprite="torch" aria-hidden="true"></div>
  <div class="torch torch-r" data-sprite="torch" aria-hidden="true"></div>

  <div class="sign-wrap">
    <div class="sign">
      <h1 class="title">
        <span class="the">the</span>
        <span class="line">Unassuming</span>
        <span class="line">Tavern</span>
      </h1>
    </div>
  </div>

  <nav aria-label="Choose a door">
    <ul id="doors" class="doors"></ul>
    <noscript><p class="nojs">The doors need JavaScript to open.</p></noscript>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <div class="ver" id="ver"></div>
</main>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
